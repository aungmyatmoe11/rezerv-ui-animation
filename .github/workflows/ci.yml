name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Playwright 1.62 needs Node 20+. A Node 18 matrix job cannot run the suite.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      # Playwright starts `next start` with NEXT_DIST_DIR=.next-prod (see
      # playwright.config.ts). The default `next build` writes `.next`, so CI
      # must build into the same folder the test server reads.
      - name: Build production
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://rezerv-ui-animation.vercel.app
          NEXT_DIST_DIR: .next-prod

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
        env:
          CI: true
          NEXT_DIST_DIR: .next-prod

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
